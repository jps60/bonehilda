<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,CanvasText)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;margin-bottom:16px}.key{display:flex;gap:6px;align-items:center}.dot{width:10px;height:10px;border-radius:3px}.plot{height:405px}.group{margin-bottom:22px}.name{font-size:13px;font-weight:600;margin-bottom:7px}.row{display:grid;grid-template-columns:104px 1fr 55px;gap:9px;align-items:center;height:27px;font-size:12px}.track{height:17px;background:var(--secondary,ButtonFace);border-radius:3px}.fill{height:17px;border-radius:3px;min-width:2px}.time{text-align:right;font-variant-numeric:tabular-nums}.note{font-size:12px;color:var(--muted-foreground,GrayText);line-height:1.5;margin-top:0}.delta{font-weight:400;color:var(--muted-foreground,GrayText);margin-left:7px}
</style></head><body><div class="legend"><span class="key"><i class="dot" style="background:var(--chart-1,Highlight)"></i>Current navigation</span><span class="key"><i class="dot" style="background:var(--chart-2,GrayText)"></i>Bypass only</span><span class="key"><i class="dot" style="background:var(--chart-3,LinkText)"></i>Bypass + shoo</span></div><div class="plot" id="plot"></div><p class="note">Median route time, seconds; lower is better. Three repetitions per mode and route (27 trials). Headless controlled arena with one waiting wolf; not a full-job or FPS benchmark.</p><script>
const data=[{"scenario":"clear","mode":"native","trials":3,"medianSeconds":2.731170654296875,"minSeconds":2.725555419921875,"maxSeconds":2.7379226684570314,"meanPathMeters":3.9989032745361328,"accepted":0,"bypasses":0},{"scenario":"clear","mode":"bypass","trials":3,"medianSeconds":2.725738525390625,"minSeconds":2.7167816162109377,"maxSeconds":2.735973358154297,"meanPathMeters":3.9989032745361328,"accepted":0,"bypasses":0},{"scenario":"clear","mode":"shoo","trials":3,"medianSeconds":2.7458648681640627,"minSeconds":2.7341537475585939,"maxSeconds":2.8295745849609377,"meanPathMeters":3.9989032745361328,"accepted":0,"bypasses":0},{"scenario":"open-tame","mode":"native","trials":3,"medianSeconds":5.750617980957031,"minSeconds":5.7504730224609379,"maxSeconds":5.7530364990234379,"meanPathMeters":3.9971790313720703,"accepted":0,"bypasses":0},{"scenario":"open-tame","mode":"bypass","trials":3,"medianSeconds":4.8408203125,"minSeconds":4.837982177734375,"maxSeconds":4.842628479003906,"meanPathMeters":6.4075841903686523,"accepted":0,"bypasses":3},{"scenario":"open-tame","mode":"shoo","trials":3,"medianSeconds":4.8278961181640629,"minSeconds":4.827293395996094,"maxSeconds":4.8395233154296879,"meanPathMeters":6.4075841903686523,"accepted":0,"bypasses":3},{"scenario":"narrow-tame","mode":"native","trials":3,"medianSeconds":5.7560272216796879,"minSeconds":5.752593994140625,"maxSeconds":5.7917633056640629,"meanPathMeters":3.9971790313720703,"accepted":0,"bypasses":0},{"scenario":"narrow-tame","mode":"bypass","trials":3,"medianSeconds":5.76361083984375,"minSeconds":5.7486724853515629,"maxSeconds":5.7743988037109379,"meanPathMeters":3.9971790313720703,"accepted":0,"bypasses":0},{"scenario":"narrow-tame","mode":"shoo","trials":3,"medianSeconds":3.632781982421875,"minSeconds":3.63165283203125,"maxSeconds":3.6542205810546877,"meanPathMeters":3.9883365631103516,"accepted":3,"bypasses":0}];
const labels={'clear':'Clear route','open-tame':'Open route with a wolf','narrow-tame':'Narrow corridor with a wolf'};
const modes=['native','bypass','shoo'];const names=['Current','Bypass only','Bypass + shoo'];
const colors=['var(--chart-1,Highlight)','var(--chart-2,GrayText)','var(--chart-3,LinkText)'];
for(const scenario of Object.keys(labels)){
 const group=document.createElement('div');group.className='group';
 const base=data.find(d=>d.scenario===scenario&&d.mode==='native').medianSeconds;
 const full=data.find(d=>d.scenario===scenario&&d.mode==='shoo').medianSeconds;
 const change=100*(base-full)/base;
 const h=document.createElement('div');h.className='name';h.textContent=labels[scenario];
 const delta=document.createElement('span');delta.className='delta';delta.textContent=change>1?`${change.toFixed(1)}% faster`:`+${(full-base).toFixed(3)} s`;
 h.append(delta);group.append(h);
 modes.forEach((mode,i)=>{const d=data.find(d=>d.scenario===scenario&&d.mode===mode);const row=document.createElement('div');row.className='row';
 const name=document.createElement('span');name.textContent=names[i];const track=document.createElement('div');track.className='track';
 const fill=document.createElement('div');fill.className='fill';fill.style.background=colors[i];fill.style.width=`${100*d.medianSeconds/7}%`;
 fill.title=`Range ${d.minSeconds.toFixed(3)}–${d.maxSeconds.toFixed(3)} s; n=${d.trials}; average path ${d.meanPathMeters.toFixed(2)} m`;
 track.append(fill);const time=document.createElement('span');time.className='time';time.textContent=`${d.medianSeconds.toFixed(2)} s`;row.append(name,track,time);group.append(row);});
 document.getElementById('plot').append(group);
}
</script></body></html>
